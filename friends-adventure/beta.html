    <style>
body{background:#090e1d;color:#fff;font-family:Arial,sans-serif;max-width:1250px;margin:0 auto}
.duo-header{min-height:65px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 16px;background:#111936;border-bottom:4px solid #222b52;flex-wrap:wrap}
.duo-header strong{display:block;font-size:19px;letter-spacing:1px;color:#ffdc5d}
.duo-header small{display:block;font-size:11px;margin-top:6px;color:#c3cbed}
.duo-actions{display:flex;gap:8px;flex-wrap:wrap}
.hero-btn{border:2px solid #7081a5;background:#293958;color:#fff;font-weight:bold;border-radius:5px;cursor:pointer;padding:10px}
.hero-btn.active{border-color:#ffde5b;background:#40527d}
#game{margin:0 auto}
#controls{margin:0 auto}
.duo-tip{text-align:center;color:#bccde9;padding:12px;font-size:13px}
</style></head>

    <body>
        
<header class="duo-header">
  <div><strong>ДВА ДРУГА · 8-БИТ</strong><small>Оригинальные 32 уровня • грибы • секретные комнаты • боссы</small></div>
  <div class="duo-actions">
    <button id="choose-black" class="hero-btn" type="button">◼ Герой в чёрном</button>
    <button id="choose-blue" class="hero-btn" type="button">🟦 Герой в синем</button>
    <button id="again" class="hero-btn" type="button">↻ 1-1</button>
  </div>
</header>

const CDN="https://cdn.jsdelivr.net/gh/zveronline/mario@main/";
const PALETTE=[[0,0,0,0],[255,255,255,255],[0,0,0,255],[188,188,188,255],[116,116,116,255],[252,216,168,255],[252,152,56,255],[252,116,180,255],[216,40,0,255],[200,76,12,255],[136,112,0,255],[124,7,0,255],[168,250,188,255],[128,208,16,255],[0,168,0,255],[24,60,92,255],[0,128,136,255],[32,56,236,255],[156,252,240,255],[60,188,252,255],[92,148,252,255],[0,130,0,255],[252,188,176,255]];
const COLORS=[[0,2,3,4,5,6,9,11],[0,2,5,6,9,15,17,19,20]];
function buildCharacterImage(image,person,pose,large){
 const w=16,h=large?32:16;
 const can=document.createElement('canvas');can.width=w;can.height=h;
 const cx=can.getContext('2d',{willReadFrequently:true});cx.imageSmoothingEnabled=false;
 const x=pose*64,y=person*96;
 cx.drawImage(image,x,y,64,96,0,0,w,h);
 const d=cx.getImageData(0,0,w,h).data,cols=COLORS[person];
 let txt='p['+cols.join(',')+']';
 for(let i=0;i<d.length;i+=4){
   if(d[i+3]<100){txt+='0';continue}
   let best=1,dist=1e20;
   for(let j=1;j<cols.length;j++){
      const pal=PALETTE[cols[j]];
      const r=d[i]-pal[0],g=d[i+1]-pal[1],b=d[i+2]-pal[2];
      const err=r*r+g*g+b*b;
      if(err<dist){dist=err;best=j}
   }
   txt+=best.toString();
 }
 return txt;
}
function fillCharacter(node,person,image,trace){
 if(typeof node==='string'){
   if(!node.startsWith('p['))return node;
   const large=trace.includes('large')||trace.includes('shrooming2')||trace.includes('shrooming3');
   let pose=0;
   if(trace.includes('dead'))pose=4;
   else if(trace.includes('jumping'))pose=3;
   else if(trace.includes('crouching'))pose=4;
   else if(trace.includes('running'))pose=trace.includes('three')?2:1;
   else if(trace.includes('paddling')||trace.includes('climbing'))pose=2;
   return buildCharacterImage(image,person,pose,large);
 }
 if(Array.isArray(node))return node; // keep original references and filters
 if(node&&typeof node==='object')for(const key of Object.keys(node))node[key]=fillCharacter(node[key],person,image,trace.concat(key));
 return node;
}
function boot(){
 const img=new Image();
 img.onload=()=>{
  try{
   const c=FullScreenMario.prototype.settings.sprites.library.Character;
   const swap=new URLSearchParams(location.search).get('hero')==='blue';
   fillCharacter(c.Player,swap?1:0,img,[]);
   fillCharacter(c.Luigi,swap?0:1,img,[]);
   FullScreenMario.prototype.settings.audio.directory=CDN+'Sounds';
   FullScreenMario.prototype.settings.ui.sizeDefault='NES';
   window.UserWrapper=new UserWrappr(FullScreenMario.prototype.proliferate({GameStartrConstructor:FullScreenMario},FullScreenMario.prototype.settings.ui,true));
   document.getElementById('choose-black').classList.toggle('active',!swap);
   document.getElementById('choose-blue').classList.toggle('active',swap);
   document.getElementById('choose-black').onclick=()=>{location.search='?hero=black'};
   document.getElementById('choose-blue').onclick=()=>{location.search='?hero=blue'};
   document.getElementById('again').onclick=()=>{if(window.FSM)FSM.MapsHandler.setMap('1-1')};
  }catch(e){showError(e)}
 };
 img.onerror=()=>showError(new Error('Не удалось загрузить персонажей'));
 img.src=RAW;
}
function showError(e){console.error(e);document.getElementById('game').innerHTML='<pre style="white-space:pre-wrap;color:white">'+String(e).replaceAll('<','&lt;')+'</pre>';}
if(document.readyState==='complete')boot();else window.addEventListener('load',boot,{once:true});
})();
</script>
