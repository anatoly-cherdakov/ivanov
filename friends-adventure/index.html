    <style id="duo-style">
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -160px,#254477,#0c1730 58%,#070d1d);color:#f7faff;font-family:Arial,Helvetica,sans-serif;max-width:none}
.duo-header{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:17px 16px;background:#0b1531;border-bottom:3px solid #233e77}
.duo-header strong{letter-spacing:2px;font-weight:900;color:#ffe072;font-size:clamp(17px,3vw,22px)}
.duo-header small{font-size:13px;color:#bbd5ff}
.duo-main{display:flex;justify-content:center;align-items:flex-start;padding:20px 12px 8px;min-height:540px}
.start-screen{width:min(630px,100%);margin:14px auto;padding:24px 24px 18px;background:#14294f;border:3px solid #6282c5;box-shadow:0 12px 30px #0309109c;border-radius:12px;text-align:center}
.friends-poster{display:block;width:min(416px,100%);height:auto;aspect-ratio:16/9;object-fit:cover;image-rendering:pixelated;border-radius:6px;border:3px solid #597fb8;margin:0 auto 18px}
.start-screen h1{font-weight:900;letter-spacing:1px;color:#ffdb61;font-size:clamp(19px,3vw,26px);margin:4px 0 9px}
.start-screen p{color:#cbd9f0}
.hero-picks{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:18px auto;max-width:435px}
.hero-pick{background:#1d3763;border:3px solid #506da2;border-radius:12px;color:#fff;cursor:pointer;min-height:160px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.hero-pick:hover,.hero-pick:focus-visible{border-color:#8dc5ff;background:#274778}
.hero-pick[aria-pressed="true"]{background:#304976;border-color:#ffda57;box-shadow:0 0 0 2px #ad7733}
.hero-pick canvas{width:64px;height:96px;image-rendering:pixelated}
.hero-pick span{font-size:18px;font-weight:800}
.hero-pick small{color:#b9d0ef;font-size:12px}
.start-actions{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:16px}
.start-actions label{font-size:14px;color:#e4effe}
select{font:inherit;background:#1d335b;border:2px solid #88a7e0;color:#fff;padding:9px 12px;border-radius:7px}
.primary{padding:13px 30px;background:#f6cd43;color:#171c2e;border:0;border-radius:8px;cursor:pointer;font-weight:900;font-size:17px;letter-spacing:.7px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.primary:not(:disabled):hover{background:#ffe985}
.menu-status{display:none;font-size:13px}.menu-status.is-error{display:block;color:#ffb89d}
.menu-help{font-size:12px;color:#b9c9e5;line-height:1.55}
#playing{width:min(512px,100%);max-width:100%;min-width:0}
.game-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:13px}
.game-actions button{background:#29446d;border:1px solid #7399d7;border-radius:6px;color:white;padding:9px 11px;cursor:pointer;font-size:13px;font-weight:700}
.game-actions label{font-size:12px;color:#a9c3e9}
.game-actions select{font-size:12px;padding:6px 5px}
#game{position:relative;display:block;width:100%;max-width:512px;height:auto;aspect-ratio:256/232;overflow:hidden;border:0;outline:3px solid #a6b9de;border-radius:2px;background:#5c94fc;box-shadow:0 8px 25px #0007;contain:layout paint}
#game .FullScreenMario{position:absolute!important;top:0!important;left:0!important;transform:scale(var(--game-scale,2))!important;transform-origin:0 0!important;width:256px!important;height:232px!important}
#game canvas{image-rendering:pixelated!important}
.ending-thanks{
 position:absolute;z-index:100;top:0;left:0;width:100%;height:100%;
 pointer-events:none;image-rendering:pixelated!important;
}
.ending-thanks[hidden]{display:none!important}
#grasshopperSpeech,#lavaSpeech{
 position:absolute;z-index:110;left:50%;top:50%;
 transform:translate(-50%,-50%);max-width:98%;
 padding:0;margin:0;border:0;border-radius:0;
 background:transparent;box-shadow:none;outline:0;
 font-family:'Press Start','Press Start 2P',monospace;
 font-size:clamp(10px,2.4vw,14px);font-weight:normal;
 line-height:1.35;letter-spacing:0;white-space:nowrap;
 color:#fff;text-align:center;text-shadow:1px 1px 0 #000;
 pointer-events:none
}
#grasshopperSpeech[hidden],#lavaSpeech[hidden]{display:none!important}
#lavaSpeech{width:96%;max-width:96%;white-space:normal;line-height:1.6}
#game #dataDisplay{font-size:11px!important}
.duo-tip{padding:9px;font-size:12px;text-align:center;color:#baccdf}
.duo-credit{margin:10px auto 20px;max-width:680px;text-align:center;font-size:11px;color:#8ea6c6;line-height:1.5;padding:0 12px}
.duo-credit a{color:#c1d7ff}

/* NES-style touch controller: only on small/mobile devices. */
.mobile-controller{display:none;width:100%;gap:clamp(6px,2.5vw,18px);align-items:center;justify-content:space-between;margin-top:12px;padding:12px 10px;border:2px solid #43557c;border-radius:17px;background:linear-gradient(155deg,#27334c,#141b31 72%);box-shadow:inset 0 2px 0 #65739155,0 7px 15px #0005;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.mobile-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;min-width:0;flex:1;max-width:190px}
.mobile-dpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:3px;width:min(48%,168px);aspect-ratio:1;flex-shrink:0}
.mobile-controller button{appearance:none;-webkit-appearance:none;touch-action:none;-webkit-user-select:none;user-select:none;cursor:pointer;outline-offset:2px;color:#fff;font-family:Arial,sans-serif;font-weight:900;line-height:1.1;box-shadow:inset 0 2px 0 #ffffff30,0 3px 0 #080d1b}
.mobile-controller button:active,.mobile-controller button.is-held{transform:translateY(2px);box-shadow:inset 0 2px 0 #ffffff21,0 1px 0 #080d1b;filter:brightness(1.25)}
.mobile-actions .pad-action{min-width:0;min-height:53px;padding:8px 3px;border-radius:35px;border:2px solid #ffa1a7;background:linear-gradient(165deg,#df3856,#9c1832);font-size:19px}
.mobile-actions .pad-turbo{min-height:53px;font-size:12px;border-color:#e698a5;background:linear-gradient(165deg,#923a56,#61223e)}
.mobile-actions .pad-turbo span{display:block;font-size:16px;line-height:1.05}
.mobile-actions .pad-turbo small{display:block;font-size:9px;letter-spacing:.35px}
.mobile-dpad .pad-arrow{border:1px solid #667ca7;border-radius:8px;background:linear-gradient(145deg,#344764,#192b49);font-size:clamp(20px,5vw,27px);min-width:0;min-height:0;padding:0}
.mobile-dpad .pad-up{grid-column:2;grid-row:1}
.mobile-dpad .pad-left{grid-column:1;grid-row:2}
.mobile-dpad .pad-center{grid-column:2;grid-row:2;background:#18263f;border-radius:5px;box-shadow:inset 0 0 0 1px #37486b}
.mobile-dpad .pad-right{grid-column:3;grid-row:2}
.mobile-dpad .pad-down{grid-column:2;grid-row:3}
@media (max-width:767px), (pointer:coarse){.mobile-controller{display:flex}}
@media (max-width:355px){.mobile-controller{padding:9px 7px;gap:7px}.mobile-actions{gap:5px}.mobile-actions .pad-action{font-size:18px;min-height:47px}.mobile-actions .pad-turbo{min-height:47px}.mobile-dpad{width:46%}}
#startScreen[hidden],#playing[hidden]{display:none!important}
body.game-active .duo-header{display:none!important}
@media(max-width:565px){
 html,body{width:100%;max-width:100%;overflow-x:clip}
 .duo-main{overflow:visible;justify-content:center;width:100%;min-width:0;min-height:0;padding:14px 12px 18px}
 .start-screen{width:100%;max-width:100%;min-width:0;margin:0;padding:16px 12px 18px}
 .friends-poster{width:100%;max-width:416px}
 .hero-picks{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:435px}
 .hero-pick{min-width:0;padding:8px 3px}
 .hero-pick span{font-size:16px}
 .hero-pick small{font-size:11px;overflow-wrap:anywhere}
 .start-actions{gap:10px}
 #playing{width:100%;max-width:512px;min-width:0}
 #game{width:100%;max-width:100%;margin:0 auto}
 .game-actions{gap:6px}
 .game-actions button{min-width:0;padding:8px 9px}
 .menu-help,.duo-tip{overflow-wrap:anywhere}
}
@media(max-width:350px){
 .duo-main{padding-inline:8px}
 .start-screen{padding:12px 8px}
 .hero-pick canvas{width:56px;height:84px}
 .game-actions button{font-size:12px;padding:7px 6px}
}
</style></head>

<header class="duo-header">
  <strong>ДВА ДРУГА · 8-БИТ</strong>
  
</header>
<main class="duo-main">
<section id="startScreen" class="start-screen" aria-labelledby="menuTitle">
 <canvas class="friends-poster" id="friends-cover" width="96" height="54" role="img" aria-label="Пиксельная совместная фотография друзей на зимнем мосту"></canvas><h1 id="menuTitle">ВЫБЕРИ СВОЕГО ГЕРОЯ</h1>
 
 <div class="hero-picks">
  <button id="choose-black" class="hero-pick" type="button" aria-pressed="false"><canvas id="portrait-black" width="64" height="96"></canvas><span>В чёрном</span><small>Ушанка и борода</small></button>
  <button id="choose-blue" class="hero-pick" type="button" aria-pressed="false"><canvas id="portrait-blue" width="64" height="96"></canvas><span>В синем</span><small>Синяя шапка и куртка</small></button>
 </div>
 <div class="start-actions">
  <label for="levelSelect">Уровень <select id="levelSelect"></select></label>
  <button id="startButton" class="primary" type="button" disabled>ИГРАТЬ</button>
 </div>
 <p id="menuStatus" class="menu-status" role="status"></p>
 <div class="menu-help">← → или A / D — ходьба · Пробел / ↑ / W — прыжок · Shift / Ctrl — бег и огонь после цветка</div>
</section>
<div id="playing" hidden>
 <nav class="game-actions"><button id="backToMenu" type="button">☰ Сменить героя</button><button id="restart" type="button">↻ Начать уровень заново</button><button id="pauseButton" type="button" aria-pressed="false">⏸ Пауза</button><label for="quality">Качество:</label><select id="quality"><option value="30" selected>30 к/с — быстро</option><option value="60">60 к/с — плавно</option><option value="20">20 к/с — экономно</option></select></nav>
 <div id="game"></div>
 <section id="mobileController" class="mobile-controller" aria-label="Сенсорный геймпад Dendy">
  <div class="mobile-actions" aria-label="Кнопки действий">
   <button type="button" class="pad-action" data-pad="a" aria-label="A — прыгать">A</button>
   <button type="button" class="pad-action" data-pad="b" aria-label="B — бег и огонь">B</button>
   <button type="button" class="pad-action pad-turbo" data-pad="a-turbo" aria-label="A Turbo — повторять прыжок"><span>A</span><small>TURBO</small></button>
   <button type="button" class="pad-action pad-turbo" data-pad="b-turbo" aria-label="B Turbo — повторять огонь и бег"><span>B</span><small>TURBO</small></button>
  </div>
  <div class="mobile-dpad" aria-label="Крестовина">
   <button type="button" class="pad-arrow pad-up" data-pad="up" aria-label="Стрелка вверх">▲</button>
   <button type="button" class="pad-arrow pad-left" data-pad="left" aria-label="Стрелка влево">◀</button>
   <span class="pad-center" aria-hidden="true"></span>
   <button type="button" class="pad-arrow pad-right" data-pad="right" aria-label="Стрелка вправо">▶</button>
   <button type="button" class="pad-arrow pad-down" data-pad="down" aria-label="Стрелка вниз">▼</button>
  </div>
 </section>
 <div class="duo-tip">← → / A, D — движение · Пробел / ↑ / W — прыжок · Shift / Ctrl — бег и огонь после цветка · P — пауза</div>
</div>
</main>

async function decodePixelArt(art){
 if(!art || !art.data || !art.palette)throw Error("Pixel art data unavailable");
 const input=Uint8Array.from(atob(art.data),c=>c.charCodeAt(0));
 if(typeof DecompressionStream!=="function")throw Error("Browser lacks DecompressionStream");
 const decoded=await new Response(
   new Blob([input]).stream().pipeThrough(new DecompressionStream("deflate"))
 ).arrayBuffer();
 const colors=new Uint8Array(decoded);
 if(colors.length!==art.w*art.h)throw Error("Pixel art size mismatch");
 const canvas=document.createElement("canvas");
 canvas.width=art.w;canvas.height=art.h;
 const context=canvas.getContext("2d");
 const img=context.createImageData(art.w,art.h);
 const palette=art.palette.map(hex=>[0,2,4,6].map(at=>parseInt(hex.slice(at,at+2),16)));
 for(let i=0;i<colors.length;i++){
   const rgba=palette[colors[i]]||[0,0,0,0];
   for(let j=0;j<4;j++)img.data[4*i+j]=rgba[j];
 }
 context.putImageData(img,0,0);
 return canvas;
}

}
function hideLavaSpeech(){
 lavaSpeechSerial++;
 const caption=$("lavaSpeech");
 if(caption)caption.hidden=true;
}
function showLavaSpeech(instance){
 if(!instance||game!==instance||$("playing").hidden)return;
 const caption=$("lavaSpeech");if(!caption)return;
 caption.textContent="Союзник, возьми меня с собой!";
 caption.hidden=false;
 const serial=++lavaSpeechSerial;
 instance.TimeHandler.addEvent(function(){
   if(game===instance&&serial===lavaSpeechSerial)caption.hidden=true;
 },180);
}
// A Podoboo is one lava-ball object that repeatedly jumps every few seconds.
// Say the phrase ONCE when that object FIRST rises into view, not at each
// repeat of its internal animation timer.
function maybeShowLavaSpeech(thing,fsm){
 if(!thing||thing.title!=="Podoboo"||thing._lavaSpeechShown||
    thing.hidden||thing.dead||!(thing.yvel<0)||
    game!==fsm||$("playing").hidden)return;
 const drawer=fsm.PixelDrawer,view=fsm.MapScreener;
 const unit=fsm.unitsize||2;
 const left=drawer.getLeft(thing),top=drawer.getTop(thing);
 if(left+thing.width*unit<=0||left>=view.width||
    top+thing.height*unit<=0||top>=view.height)return;
 thing._lavaSpeechShown=true;
 showLavaSpeech(fsm);
}

     .catch(error=>console.error("Unable to decode ending sprite",key,error));
 }
}

function paintCastleEnding(){
 const canvas=$("endingThanks");
 if(!canvas)return;

 if(!endingGreetingVisible&&!endingSecondVisible){canvas.hidden=true;return;}
 canvas.hidden=false;

  // Case-sensitive Cyrillic: lowercase letters are truly lowercase bitmaps.
  const chars=Array.from(value.normalize("NFC"));
  const startX=Math.floor((256-chars.length*9+1)/2);

    const bitmap=endingPixelGlyphs[letter];

      for(let col=0;col<8;col++)

/*
 * Multi-touch gamepad, mapped to real FullScreenMario input handlers.
 * One finger can hold a direction while another jumps or fires.
 * Turbo generates real alternating key-down/key-up edges.
 */
const padMapping={
 "a":"Up","b":"Sprint","a-turbo":"Up","b-turbo":"Sprint",
 "up":"Up","down":"Down","left":"Left","right":"Right"
};
const padHeld={Up:new Set(),Sprint:new Set(),Down:new Set(),Left:new Set(),Right:new Set()};
const padPointers=new Map();
const padEvent={preventDefault(){}};
function padReady(){
 return !!(game&&game.player&&!$("playing").hidden
    &&game.GamesRunner&&!game.GamesRunner.getPaused());
}
function padSignal(action,pressed){
 if(!game||!game.player)return;
 const handler=game["key"+(pressed?"Down":"Up")+action];
 if(typeof handler==="function")handler(game.player,padEvent);
}
function padPress(action,token){
 const holders=padHeld[action];
 if(!holders||holders.has(token)||!padReady())return;
 if(holders.size===0)padSignal(action,true);
 holders.add(token);
}
function padRelease(action,token){
 const holders=padHeld[action];
 if(!holders||!holders.delete(token))return;
 if(holders.size===0){
   padSignal(action,false);
   // If two opposite directions were held, let the other stay active.
   const opposite=action==="Left"?"Right":action==="Right"?"Left":null;
   if(opposite&&padHeld[opposite].size>0&&padReady())padSignal(opposite,true);
 }
}
function padStopPointer(pointerId){
 const state=padPointers.get(pointerId);
 if(!state)return;
 padPointers.delete(pointerId);
 if(state.timer)clearInterval(state.timer);
 if(state.name==="b-turbo"&&game&&game.player){
   // Keep Turbo enabled only while at least one B Turbo finger remains.
   game.player.turboFire=[...padPointers.values()].some(
      pointer=>pointer.name==="b-turbo");
 }
 padRelease(state.action,state.token);
 state.button.classList.remove("is-held");
}
function padStopAll(){
 for(const id of [...padPointers.keys()])padStopPointer(id);
 for(const action of Object.keys(padHeld)){
   if(padHeld[action].size){
     padHeld[action].clear();
     padSignal(action,false);
   }
 }
}
/*
 * Turbo controls: held A repeats on landing, held B runs continuously and
 * fires at one evenly spaced pulse per 170ms. Ball count/lifetime are handled
 * by the game engine; we never overwrite the live numballs counter.
 */
// The engine now has a bounded seven-ball Turbo pool with automatic expiry.
 // No counter manipulation, no accumulated fire requests and no burst queue.
function padTurboShoot(player){
 if(player.power!==3 || player.crouching || player.dying || player.dead
    || typeof player.fire!=="function")return;
 player.fire(player);
}
function padTurboTick(state){
 if(!padPointers.has(state.pointerId))return;
 if(!padReady()){padStopPointer(state.pointerId);return;}
 const player=game.player,now=Date.now();
 if(!player.alive||player.dead||player.dying)return;
 if(state.name==="a-turbo"){
   if(state.jumpHeld){
     if(now>=state.jumpReleaseAt){
       padRelease("Up",state.token);
       state.jumpHeld=false;
     }
   }else if(now>=state.nextJumpAt && player.canjump
      && (player.resting || game.MapScreener.underwater)){
     padPress("Up",state.token);
     state.jumpHeld=true;
     // Short tap for low, frequent jumps; landings may take longer naturally.
     state.jumpReleaseAt=now+90;
     state.nextJumpAt=now+105;
   }
 }else if(state.name==="b-turbo"){
   // Exactly one shot attempt per clock tick, with no catch-up bursts.
   // Sprint remains held for the whole press.
   padTurboShoot(player);
 }
}
function setupMobileController(){
 const root=$("mobileController");
 if(!root)return;
 root.addEventListener("contextmenu",event=>event.preventDefault());
 for(const button of root.querySelectorAll("button[data-pad]")){
   button.addEventListener("pointerdown",event=>{
     if(!padReady())return;
     event.preventDefault();
     const name=button.dataset.pad,action=padMapping[name];
     if(!action||padPointers.has(event.pointerId))return;
     const token=name+":"+event.pointerId;
     const now=Date.now();
     const state={
       action,token,button,pointerId:event.pointerId,name,timer:null,
       jumpHeld:name==="a-turbo",jumpReleaseAt:now+90,
       nextJumpAt:now+105
     };
     padPointers.set(event.pointerId,state);
     button.classList.add("is-held");
     try{button.setPointerCapture(event.pointerId)}catch(_){}
     if(name==="b-turbo")game.player.turboFire=true;
     padPress(action,token);
     if(name.endsWith("-turbo")){
       // B Turbo sends regular pulses ~6 per second, including when held for
       // many seconds. A Turbo retains fast landing detection.
       state.timer=setInterval(()=>padTurboTick(state),
          name==="b-turbo" ? 170 : 16);
     }
   });
   button.addEventListener("pointerup",event=>{event.preventDefault();padStopPointer(event.pointerId)});
   button.addEventListener("pointercancel",event=>{event.preventDefault();padStopPointer(event.pointerId)});
   button.addEventListener("lostpointercapture",event=>padStopPointer(event.pointerId));
   button.addEventListener("dragstart",event=>event.preventDefault());
 }
 window.addEventListener("pointerup",event=>padStopPointer(event.pointerId));
 window.addEventListener("pointercancel",event=>padStopPointer(event.pointerId));

}

            const rim=Number.isFinite(plant._pipeRim)?plant._pipeRim:plant.bottom;

   // Synchronize the visible control also when the engine pauses externally.
   const runner=fsm.GamesRunner;
   const nativePauseHook=runner.onPause, nativePlayHook=runner.onPlay;
   runner.onPause=function(){
     const result=typeof nativePauseHook==="function" ? nativePauseHook.apply(this,arguments) : undefined;
     padStopAll();
     syncPauseButton();
     return result;
   };
   runner.onPlay=function(){
     const result=typeof nativePlayHook==="function" ? nativePlayHook.apply(this,arguments) : undefined;
     syncPauseButton();
     return result;
   };
   $("game").textContent="";
   $("game").appendChild(fsm.container);
   const endingMessage=document.createElement("canvas");
   endingMessage.id="endingThanks";
   endingMessage.className="ending-thanks";
   endingMessage.width=256;
   endingMessage.height=232;
   endingMessage.hidden=true;
   endingMessage.setAttribute("role","img");
   endingMessage.setAttribute("aria-label","");
   $("game").appendChild(endingMessage);
   const pogoCaption=document.createElement("div");
   pogoCaption.id="grasshopperSpeech";
   pogoCaption.textContent="Я могу и 10 грамм";
   pogoCaption.hidden=true;
   $("game").appendChild(pogoCaption);
   const lavaCaption=document.createElement("div");
   lavaCaption.id="lavaSpeech";
   lavaCaption.textContent="Союзник, возьми меня с собой!";
   lavaCaption.hidden=true;
   lavaCaption.setAttribute("role","status");
   $("game").appendChild(lavaCaption);
   // Keep Kuznechik across level/map changes until the hero takes damage.
   // The original setMap implementation is not modified.
   // Clear the ending caption when the engine travels to another location.
   const nativeLocation=fsm.setLocation;
   fsm.setLocation=function(){
     hideEndingThanks();
     hideLavaSpeech();
     return nativeLocation.apply(this,arguments);
   };
   fsm.PixelDrawer.setFramerateSkip(2);
   configureRenderer(fsm);
   const keydown=fsm.InputWriter.makePipe("onkeydown","keyCode");
   const keyup=fsm.InputWriter.makePipe("onkeyup","keyCode");
   document.body.onkeydown=function(event){
      if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(event.key))event.preventDefault();
      return keydown(event);
   };
   document.body.onkeyup=function(event){return keyup(event);};
   $("game").onmousedown=fsm.InputWriter.makePipe("onmousedown","which");
   // Show only the game before any simulation/time starts.
   $("startScreen").hidden=true;
   $("playing").hidden=false;
   document.body.classList.add("game-active");
   syncGameScale();
   fsm.gameStart();
   const name=$("levelSelect").value;
   if(name!=="1-1")fsm.setMap(name);
   if(fsm.GamesRunner.getPaused())fsm.GamesRunner.play();
   syncPauseButton();
   changeQuality();
   $("game").focus();
  } catch(err) {
   console.error(err);
   status("Ошибка запуска: "+String(err&&err.message||err));
   $("startScreen").hidden=false;
   $("playing").hidden=true;
   document.body.classList.remove("game-active");
  } finally {
   busy=false;
   $("startButton").disabled=chosen<0;
  }
 },30);
}
function backToMenu(){
 hideLavaSpeech();
 resetKuznechik();
 pauseKeyHeld=false;
 hideEndingThanks();
 padStopAll();
 if(game&&!game.GamesRunner.getPaused())game.GamesRunner.pause();
 $("playing").hidden=true;
 $("startScreen").hidden=false;
 document.body.classList.remove("game-active");
 status("Выбери персонажа, затем нажми «Играть». Игровое время остановлено.");
}
function restart(){
 hideLavaSpeech();
 resetKuznechik();
 pauseKeyHeld=false;
 hideEndingThanks();
 padStopAll();
 if(!game)return;
 game.setMap($("levelSelect").value||"1-1");
 if(game.GamesRunner.getPaused())game.GamesRunner.play();
 syncPauseButton();
}
function setup(){
 document.addEventListener("keydown",pauseKeyDown,true);
 document.addEventListener("keyup",pauseKeyUp,true);
 window.addEventListener("blur",()=>{pauseKeyHeld=false;});
 loadEndingArt();
 loadRoerichBoss();
 setupMobileController();
 if(typeof ResizeObserver==="function"){
   const gameResizeObserver=new ResizeObserver(syncGameScale);
   gameResizeObserver.observe($("game"));
 }
 window.addEventListener("resize",syncGameScale,{passive:true});
 window.addEventListener("orientationchange",syncGameScale);
 displayCover();
 $("choose-black").onclick=()=>selectHero(0);
 $("choose-blue").onclick=()=>selectHero(1);
 $("startButton").onclick=beginGame;
 $("backToMenu").onclick=backToMenu;
 $("restart").onclick=restart;
 $("pauseButton").onclick=toggleGamePause;
 $("quality").onchange=changeQuality;
 for(let world=1;world<=8;world++)for(let stage=1;stage<=4;stage++){
  const option=document.createElement("option"),name=world+"-"+stage;
  option.value=name;option.textContent=name;$("levelSelect").appendChild(option);
 }
 heroImage.onload=()=>{
  loadFireSprite();
  paintPreview("portrait-black",0);
  paintPreview("portrait-blue",1);
  $("startButton").disabled=chosen<0;
  status("");
 };
 heroImage.onerror=()=>status("Не удалось загрузить изображения героев.");
 heroImage.src=RAW;
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",setup,{once:true});else setup();
})();
</script>
